    <h2 class="reader__chapter">Chương 13: Bóng tối</h2>
    <div id="chapter-c">
      <p>Bóng tối rơi xuống cho tới khi không còn một tiếng động nào vang lên nữa.</p>
      <p>Nhiên Dạ chậm rãi rút gươm khỏi vỏ, lưỡi bạc phản chiếu ánh trăng khuất.</p>
      <p>Hắn biết phía sau những bậc đá đó đang chờ một thứ gì đó rất đói.</p>
      <p>Chân bước xuống, mỗi bước mở thêm một vòng tĩnh lặng càng dày.</p>
