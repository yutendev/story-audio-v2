      <p>Ngọn đèn trong đại điện lóe lên rồi tắt. Bóng lưới cửa sổ đổ dài xuống nền đá.</p>
      <p>Người gác đêm rời đi, quên cả đống than còn ấm ở góc phòng.</p>
      <p>Từ hầm sâu bên dưới lại vang lên một tiếng gõ, đều như nhịp thở.</p>
